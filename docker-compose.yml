services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: armsbank_db
      POSTGRES_USER: armsbank
      POSTGRES_PASSWORD: change-me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U armsbank -d armsbank_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ARMSBANK_DB_HOST: db
      ARMSBANK_DB_PORT: 5432
      ARMSBANK_DB_NAME: armsbank_db
      ARMSBANK_DB_USER: armsbank
      ARMSBANK_DB_PASSWORD: change-me
    ports:
      - "8000:8000"

volumes:
  pgdata:
